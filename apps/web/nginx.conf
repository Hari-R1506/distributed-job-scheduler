server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Proxy the API through this origin.
    #
    # Same-origin means no CORS preflight on every request, and — more
    # importantly — the refresh cookie is genuinely same-site rather than
    # relying on cross-site cookie rules that browsers keep tightening.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For the WebSocket upgrade, if the live-updates bonus lands.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Job creation is fast, but a slow batch insert should not be cut off.
        proxy_read_timeout 60s;
    }

    # Convenience: /docs and /metrics on the dashboard's origin too, so the
    # "API docs" link in the header just works.
    location ~ ^/(docs|docs-json|metrics|health|ready) {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    # Hashed filenames are immutable by construction, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: /jobs/abc123 is a client route, not a file. Serve index.html
    # and let React Router resolve it — without this, a page refresh on any
    # route but / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
